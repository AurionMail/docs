name: Build and Attach CryptPad Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch CryptPad and Customized Release Tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CRYPTPAD_TAG=$(gh release view --repo cryptpad/cryptpad --json tagName -q .tagName)
          CUSTOM_TAG=$(gh release view --repo AurionMail/cryptpad_customized --json tagName -q .tagName)
          
          echo "CryptPad latest release: $CRYPTPAD_TAG"
          echo "Customized latest release: $CUSTOM_TAG"
          
          echo "cryptpad_tag=$CRYPTPAD_TAG" >> $GITHUB_OUTPUT
          echo "custom_tag=$CUSTOM_TAG" >> $GITHUB_OUTPUT

      - name: Download and extract CryptPad
        run: |
          CRYPTPAD_TAG="${{ steps.tags.outputs.cryptpad_tag }}"
          curl -L "https://github.com/cryptpad/cryptpad/archive/refs/tags/${CRYPTPAD_TAG}.zip" -o cryptpad.zip
          unzip -q cryptpad.zip
          
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "cryptpad-*" | head -n 1)
          mv "$EXTRACTED_DIR" cryptpad
          rm cryptpad.zip
          
          cp -r cryptpad cryptpad-office

      - name: Install Dependencies (Standard)
        run: |
          cd cryptpad
          npm ci
          npm run install:components

      - name: Install Dependencies & OnlyOffice (Office version)
        run: |
          cd cryptpad-office
          ls -all
          npm ci
          npm run install:components
          ./install-onlyoffice.sh

      - name: Add SSO Plugin (Both)
        run: |
          for dir in cryptpad cryptpad-office; do
            cd "$dir/lib"
            mkdir -p plugins
            cd plugins
            git clone https://github.com/cryptpad/sso
            cd sso
            npm ci
            cd ../../../..
          done

      - name: Download, extract and overwrite customized files (Both)
        run: |
          CUSTOM_TAG="${{ steps.tags.outputs.custom_tag }}"
          curl -L "https://github.com/AurionMail/cryptpad_customized/archive/refs/tags/${CUSTOM_TAG}.zip" -o customized.zip
          unzip -q customized.zip
          
          EXTRACTED_CUSTOM=$(find . -maxdepth 1 -type d -name "cryptpad_customized-*" | head -n 1)
          
          for dir in cryptpad cryptpad-office; do
            # 1. Move customize directory to cryptpad root
            if [ -d "$EXTRACTED_CUSTOM/customize" ]; then
              cp -r "$EXTRACTED_CUSTOM/customize" "$dir/"
            fi
            
            # 2. Overwrite node directory files in cryptpad
            if [ -d "$EXTRACTED_CUSTOM/node_modules" ]; then
              cp -r "$EXTRACTED_CUSTOM/node_modules/." "$dir/node_modules/"
            fi
            
            # 3. Overwrite www directory files in cryptpad
            if [ -d "$EXTRACTED_CUSTOM/www" ]; then
              cp -r "$EXTRACTED_CUSTOM/www/." "$dir/www/"
            fi
          done
          
          # Clean up downloaded customized archive and folder
          rm -rf "$EXTRACTED_CUSTOM" customized.zip

      - name: Archive CryptPad Packages
        run: |
          zip -r cryptpad.zip cryptpad/
          zip -r cryptpad-office.zip cryptpad-office/

      - name: Upload zips to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} cryptpad.zip cryptpad-office.zip --clobber