name: Build and Attach Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create folder structure
        run: |
          mkdir -p aurionmail/hydra
          mkdir -p aurionmail/hydra/{bin,config}
          mkdir -p aurionmail/api
          mkdir -p aurionmail/sso
          mkdir -p aurionmail/bridges

      - name: Download and extract Hydra
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HYDRA_TAG=$(gh release view --repo ory/hydra --json tagName -q .tagName)
          # Strip leading 'v' if present for the archive name
          HYDRA_VERSION="${HYDRA_TAG#v}"
          
          echo "Downloading Hydra version: $HYDRA_TAG"
          curl -L "https://github.com/ory/hydra/releases/download/${HYDRA_TAG}/hydra_${HYDRA_VERSION}-linux_64bit.tar.gz" -o hydra.tar.gz
          tar -xzf hydra.tar.gz -C aurionmail/hydra/bin
          rm hydra.tar.gz

      - name: Download and extract API zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_TAG=$(gh release view --repo AurionMail/core-api --json tagName -q .tagName)
          
          echo "Downloading Core API version: $API_TAG"
          curl -L "https://github.com/AurionMail/core-api/releases/download/${API_TAG}/aurion-api.zip" -o api.zip
          unzip -q api.zip -d aurionmail/api
          chmod +x aurionmail/api/aurion-api
          rm api.zip

      - name: Download and extract SSO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSO_TAG=$(gh release view --repo AurionMail/sso --json tagName -q .tagName)
          
          echo "Downloading SSO version: $SSO_TAG"
          curl -L "https://github.com/AurionMail/sso/releases/download/${SSO_TAG}/aurion-sso.zip" -o sso.zip
          unzip -q sso.zip -d aurionmail/sso
          rm sso.zip

      - name: Download and extract Bridges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRIDGES_TAG=$(gh release view --repo AurionMail/bridges --json tagName -q .tagName)
          
          echo "Downloading Bridges version: $BRIDGES_TAG"
          curl -L "https://github.com/AurionMail/bridges/archive/refs/tags/${BRIDGES_TAG}.zip" -o bridges.zip
          # --strip-components/junk paths to extract directly into bridges folder
          unzip -q -j bridges.zip -d aurionmail/bridges
          rm bridges.zip

      - name: Zip aurion directory
        run: |
          zip -r aurionmail.zip aurionmail/

      - name: Upload zip to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} aurionmail.zip --clobber